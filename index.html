<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>BRN — Explorador</title>
<style>
  :root { --bg:#0e1117; --fg:#e6edf3; --muted:#8b949e; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-monospace, "SF Mono", Consolas, monospace;
         background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid #21262d; display:flex;
           align-items:center; gap:16px; }
  h1 { font-size:16px; margin:0; }
  .stat { color:var(--muted); font-size:12px; }
  main { padding:24px; display:grid; gap:24px; }
  section { border:1px solid #21262d; border-radius:8px; overflow:hidden; }
  section h2 { margin:0; font-size:13px; padding:10px 16px; background:#161b22;
               border-bottom:1px solid #21262d; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:8px 16px; text-align:left; border-bottom:1px solid #21262d; }
  th { color:var(--muted); font-weight:500; }
  tr:last-child td { border-bottom:none; }
  .mono { font-family: ui-monospace; }
  .accent { color:var(--accent); }
  input { background:#161b22; border:1px solid #30363d; color:var(--fg);
          padding:8px 12px; border-radius:6px; font-family:inherit; width:100%; }
  button { background:#21262d; border:1px solid #30363d; color:var(--fg);
           padding:8px 16px; border-radius:6px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>BRN — BrunoCoin</h1>
  <span class="stat" id="h">altura: —</span>
  <span class="stat" id="tip">tip: —</span>
  <span class="stat" id="mp">mempool: —</span>
  <span class="stat" id="ut">utxos: —</span>
</header>
<main>
  <section>
    <h2>Consulta de saldo</h2>
    <div style="padding:16px; display:flex; gap:8px;">
      <input id="addr" placeholder="brn1..." />
      <button onclick="lookup()">Consultar</button>
    </div>
    <div id="bal" style="padding:0 16px 16px;"></div>
  </section>
  <section>
    <h2>Últimos blocos</h2>
    <table><thead><tr><th>Altura</th><th>Hash</th><th>Timestamp</th><th>Txs</th></tr></thead>
    <tbody id="blocks"></tbody></table>
  </section>
  <section>
    <h2>Mempool</h2>
    <table><thead><tr><th>TXID</th><th>Inputs</th><th>Outputs</th></tr></thead>
    <tbody id="mp-body"></tbody></table>
  </section>
</main>
<script>
const fmt = (h) => h ? h.slice(0,20)+"…" : "—";
async function refresh() {
  try {
    const s = await (await fetch("/api/status")).json();
    document.getElementById("h").textContent = "altura: " + s.height;
    document.getElementById("tip").textContent = "tip: " + fmt(s.tip);
    document.getElementById("mp").textContent = "mempool: " + s.mempool;
    document.getElementById("ut").textContent = "utxos: " + s.utxos;
    const blocks = await (await fetch("/api/latest")).json();
    document.getElementById("blocks").innerHTML = blocks.slice().reverse().map(b =>
      `<tr><td>${b.height}</td><td class="mono accent">${fmt(b.hash)}</td>
       <td>${new Date(b.timestamp*1000).toLocaleString()}</td>
       <td>${b.transactions.length}</td></tr>`).join("");
    const mp = await (await fetch("/api/mempool")).json();
    document.getElementById("mp-body").innerHTML = mp.slice(0,20).map(t =>
      `<tr><td class="mono">${fmt(t.txid)}</td>
       <td>${t.inputs.length}</td><td>${t.outputs.length}</td></tr>`).join("")
       || '<tr><td colspan="3" style="color:var(--muted)">vazia</td></tr>';
  } catch (e) { console.error(e); }
}
async function lookup() {
  const a = document.getElementById("addr").value.trim();
  if (!a) return;
  const r = await (await fetch("/api/balance/"+encodeURIComponent(a))).json();
  document.getElementById("bal").innerHTML =
    `<div class="mono accent">${a}</div>
     <div style="margin-top:8px">saldo: <b>${(r.balance/1e8).toFixed(8)} BRN</b>
     (${r.utxos.length} UTXOs)</div>`;
}
setInterval(refresh, 5000); refresh();
</script>
</body>
</html>
